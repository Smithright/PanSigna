[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pansigna-research"
version = "0.1.0"
description = "Controlled experiments in semantic canonicalization and causal legibility"
requires-python = ">=3.12"
dependencies = ["torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
